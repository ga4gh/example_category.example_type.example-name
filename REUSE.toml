version = 1
SPDX-PackageName = "ga4gh-product-template"
SPDX-PackageSupplier = "GA4GH <tech-team@ga4gh.org>"
SPDX-PackageDownloadLocation = "https://github.com/ga4gh/ga4gh-product_name"

# Default license for the bulk of the codebase.
# Individual files can still override this with their own
# SPDX-License-Identifier header — that always takes precedence.
[[annotations]]
path = "src/**"
SPDX-FileCopyrightText = "2021-2026 Your Org / GA4GH Contributors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "schemas/**"
SPDX-FileCopyrightText = "2021-2026 Your Org / GA4GH Contributors"
SPDX-License-Identifier = "Apache-2.0"

# Vendored third-party code that must keep its own license.
[[annotations]]
path = "vendor/example-gpl-dep/**"
SPDX-FileCopyrightText = "Upstream authors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Reference data / docs released under a data-appropriate license.
[[annotations]]
path = "data/**"
SPDX-FileCopyrightText = "2021-2026 Your Org / GA4GH Contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# Files where headers are impractical (images, generated files, etc.)
[[annotations]]
path = ["**.png", "**.svg", "**/generated/**"]
SPDX-FileCopyrightText = "2021-2026 Your Org / GA4GH Contributors"
SPDX-License-Identifier = "Apache-2.0"
